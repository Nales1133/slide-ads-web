<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7B8DA">
<meta name="description" content="Slidy y Bizy: un juego musical de memoria para peques. Escucha la melodía, repítela, aprende canciones y letras.">
<meta property="og:title" content="Slidy · El juego musical para peques">
<meta property="og:description" content="Escucha la melodía de Slidy y repítela. Aprende canciones y tus primeras letras.">
<meta property="og:image" content="https://nales1133.github.io/slide-ads-web/img/slidy-poster.jpg">
<meta property="og:type" content="website">
<title>Slidy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: una columna de móvil. Marcador arriba, Slidy al centro rodeado de teclas (4 en cruz u 8 en anillo), y debajo el menú de modo, nivel y canción. */
:root{
  color-scheme: light;
  --lavender:#8E93CB; --lavender-edge:#5157A0;
  --coral:#F8769C; --coral-edge:#E0457A;
  --blossom:#FFDBED;
  --butter:#FFC94D; --butter-edge:#DB9A16;
  --mint:#6FD3BE; --mint-edge:#36A58C;
  --orange:#FF9F6B; --orange-edge:#E2703A;
  --lime:#A6D96A; --lime-edge:#77AE38;
  --sky:#7CC3F0; --sky-edge:#4593C8;
  --violet:#B892E6; --violet-edge:#8A5EC4;
  --ink:#3B3F75; --ink-soft:#5C61A8;
  --glass:rgba(255,255,255,.48); --glass-strong:rgba(255,255,255,.78); --glass-line:rgba(255,255,255,.75);
  /* Paleta Rosa (por defecto) */
  --bg:linear-gradient(170deg, #8E93CB 0%, #C08DBB 26%, #F8769C 52%, #FBB4CF 78%, #FFDBED 100%);
  --bg-base:#F3B3CF;
  --go1:#FF8DAE; --go2:#EE5A88; --go-edge:#C93A68; --go-text-sh:rgba(160,30,75,.35);
  --accent-text:#D93F72; --pill-sh:rgba(224,69,122,.35); --ring:rgba(248,118,156,.5);
  --tshadow:rgba(81,87,160,.35); --pill-bg:#FFF0F7;
  --display:'Fredoka', 'Nunito', system-ui, sans-serif;
  --body:'Nunito', system-ui, sans-serif;
}
/* Paleta Azul */
html[data-pal="azul"]{
  --bg:linear-gradient(170deg, #5E9BEA 0%, #86BDF3 28%, #B9DDF8 55%, #FFF1C4 82%, #FFE49A 100%);
  --bg-base:#B9DDF8;
  --go1:#6FB2FF; --go2:#3F86EE; --go-edge:#2B63C2; --go-text-sh:rgba(20,60,140,.35);
  --accent-text:#2A66CF; --pill-sh:rgba(43,99,194,.35); --ring:rgba(111,178,255,.55);
  --tshadow:rgba(35,75,150,.38); --pill-bg:#EEF6FF;
}
html,body{height:100%}
body{
  margin:0; padding-inline:16px; color:var(--ink); font-family:var(--body);
  background:var(--bg-base) var(--bg) fixed; transition:background-color .4s;
  -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
}
[hidden]{display:none!important}
button{font-family:inherit; color:inherit; -webkit-user-select:none; user-select:none}
.app{max-width:440px; margin:0 auto; min-height:100%; box-sizing:border-box; display:flex; flex-direction:column; gap:12px; padding-block:14px 22px}

/* ---------- Cabecera ---------- */
header{display:flex; align-items:center; justify-content:space-between; gap:8px}
.brand{display:flex; align-items:center; gap:6px; min-width:0; font:inherit; color:inherit}
.brand .mini{width:42px; height:42px; flex-shrink:0; overflow:visible; filter:drop-shadow(0 4px 8px rgba(59,63,117,.25))}
.brand b{font-family:var(--display); font-weight:700; font-size:19px; color:#fff; letter-spacing:.4px;
  padding:1px 9px 3px; border-radius:16px; border:3px solid #fff; transform:rotate(-3deg);
  background:var(--char-c); text-shadow:0 2px 0 var(--char-edge); box-shadow:0 4px 0 var(--char-edge), 0 8px 14px rgba(59,63,117,.25)}
html{--char-c:#F43F8C; --char-edge:#C8226C}
html[data-char="bizy"]{--char-c:#FFC21A; --char-edge:#E08A00}
.chips{display:flex; align-items:center; gap:6px}
.chip{
  height:44px; min-width:44px; box-sizing:border-box; border-radius:22px; padding:0 12px;
  display:flex; align-items:center; justify-content:center; gap:6px;
  background:var(--glass); border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  box-shadow:0 6px 16px rgba(59,63,117,.14), inset 0 1px 0 rgba(255,255,255,.9);
  font-family:var(--display); font-weight:600; font-size:16px; color:var(--ink); white-space:nowrap;
}
.chip small{font-family:var(--body); font-size:11px; font-weight:800; color:var(--ink-soft); letter-spacing:.6px; text-transform:uppercase}
.stars{gap:2px; padding:0 9px}
.stars svg{width:19px; height:19px; transition:transform .3s, opacity .3s}
.stars svg.lost{opacity:.28; transform:scale(.8)}
button.chip{cursor:pointer; padding:0; transition:transform .1s}
button.chip:active{transform:scale(.9)}
button.chip svg{width:22px; height:22px}

.status{
  text-align:center; font-family:var(--display); font-weight:600; font-size:clamp(21px, 6.2vw, 27px);
  color:#fff; text-shadow:0 2px 0 var(--tshadow); min-height:1.3em; text-wrap:balance; line-height:1.2;
}

/* ---------- Escenario ---------- */
.stage{
  --side:min(calc(100vw - 32px), 400px, 50vh); position:relative; width:var(--side); height:var(--side); flex-shrink:0; margin:0 auto;
  display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); grid-template-rows:repeat(3, minmax(0, 1fr)); gap:11px;
  touch-action:none; -webkit-user-select:none; user-select:none;
}
.stage::before{
  content:""; position:absolute; inset:6%; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.55) 0%, rgba(255,219,237,.25) 55%, transparent 72%);
  pointer-events:none;
}
.pad{
  --c:var(--coral); --e:var(--coral-edge);
  position:relative; border:0; border-radius:28px; cursor:pointer; padding:0;
  background:linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,0) 55%), var(--c);
  box-shadow:0 8px 0 var(--e), 0 16px 26px rgba(59,63,117,.22), inset 0 2px 0 rgba(255,255,255,.55);
  transition:transform .07s ease, box-shadow .07s ease, filter .18s ease;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  touch-action:none; animation:padIn .35s cubic-bezier(.3,1.5,.5,1);
}
@keyframes padIn{from{transform:scale(.6); opacity:0}to{transform:none; opacity:1}}
.pad svg{width:44%; height:44%; fill:#fff; filter:drop-shadow(0 3px 0 var(--e)); pointer-events:none}
.pad .nn{display:none; font-family:var(--display); font-weight:700; font-size:clamp(13px, 3.8vw, 17px); color:#fff; text-shadow:0 2px 0 var(--e); pointer-events:none; line-height:1}
.show-names .pad .nn{display:block}
.pad.down{transform:translateY(6px); box-shadow:0 2px 0 var(--e), 0 6px 12px rgba(59,63,117,.2), inset 0 2px 0 rgba(255,255,255,.55)}
.pad.lit{filter:brightness(1.12) saturate(1.15); box-shadow:0 8px 0 var(--e), 0 0 0 6px rgba(255,255,255,.85), 0 0 40px 10px var(--c)}
.pad.lit.down{box-shadow:0 2px 0 var(--e), 0 0 0 6px rgba(255,255,255,.85), 0 0 40px 10px var(--c)}
.pad.hint::after{content:""; position:absolute; inset:-7px; border-radius:34px; border:4px solid #fff; opacity:0; animation:hint 1s ease-in-out infinite; pointer-events:none}
@keyframes hint{50%{opacity:.9}}
.pad:focus{outline:none}
.pad:focus-visible{outline:4px solid #fff; outline-offset:4px}
.pad[data-i="0"]{grid-area:1/2; --c:var(--coral); --e:var(--coral-edge)}
.pad[data-i="1"]{grid-area:1/3; --c:var(--orange); --e:var(--orange-edge)}
.pad[data-i="2"]{grid-area:2/3; --c:var(--butter); --e:var(--butter-edge)}
.pad[data-i="3"]{grid-area:3/3; --c:var(--lime); --e:var(--lime-edge)}
.pad[data-i="4"]{grid-area:3/2; --c:var(--mint); --e:var(--mint-edge)}
.pad[data-i="5"]{grid-area:3/1; --c:var(--sky); --e:var(--sky-edge)}
.pad[data-i="6"]{grid-area:2/1; --c:var(--lavender); --e:var(--lavender-edge)}
.pad[data-i="7"]{grid-area:1/1; --c:var(--violet); --e:var(--violet-edge)}

.slidy{grid-area:2/2; position:relative; display:flex; align-items:center; justify-content:center; z-index:2; pointer-events:none}
.slidy .wrap{width:124%; flex-shrink:0; transform-origin:50% 85%}
.slidy svg{display:block; width:100%; height:auto; overflow:visible; filter:drop-shadow(0 10px 14px rgba(59,63,117,.28))}

/* Caras de Slidy: cada grupo se muestra según el estado del SVG. */
.face .e-open, .face .e-happy, .face .e-squeeze,
.face .m-smile, .face .m-o, .face .m-big, .face .m-wobble{display:none}
.face[data-eyes="open"] .e-open, .face[data-eyes="happy"] .e-happy, .face[data-eyes="squeeze"] .e-squeeze{display:inline}
.face[data-mouth="smile"] .m-smile, .face[data-mouth="o"] .m-o, .face[data-mouth="big"] .m-big, .face[data-mouth="wobble"] .m-wobble{display:inline}
.face .pupils{transform:translate(var(--px, 0px), var(--py, 0px)); transition:transform .18s cubic-bezier(.3,1.4,.5,1)}
.face .lids{transform-box:fill-box; transform-origin:center; transition:transform .09s}
.face.blink .lids{transform:scaleY(.08)}
.face .brow{transform-box:fill-box; transform-origin:center; transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.face[data-brows="up"] .brow{transform:translateY(-7px)}
.face[data-brows="sad"] .brow-l{transform:translateY(-2px) rotate(-16deg)}
.face[data-brows="sad"] .brow-r{transform:translateY(-2px) rotate(16deg)}
.face .cheek{transform-box:fill-box; transform-origin:center; transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.face.puff .cheek{transform:scale(1.45)}
.face .ear{transform-box:fill-box; transform-origin:50% 100%}

.a-sing{animation:sing .26s ease-out}
@keyframes sing{0%{transform:scale(1)}40%{transform:scale(1.06, .96)}100%{transform:scale(1)}}
.a-nod{animation:nod .55s ease-in-out}
@keyframes nod{0%,100%{transform:none}25%{transform:translateY(7px)}50%{transform:translateY(-3px)}75%{transform:translateY(5px)}}
.a-dance{animation:dance 1.6s ease-in-out}
@keyframes dance{
  0%,100%{transform:none}
  10%{transform:translateY(-14px) rotate(-10deg)}
  20%{transform:translateY(0) rotate(0)}
  30%{transform:translateY(-14px) rotate(10deg)}
  40%{transform:translateY(0) rotate(0)}
  52%{transform:translateY(-22px) rotate(360deg) scale(1.05)}
  64%{transform:translateY(0) rotate(360deg)}
  74%{transform:translateY(5px) rotate(360deg) scale(1.08, .9)}
  86%{transform:translateY(-12px) rotate(360deg) scale(.96, 1.06)}
}
.a-dance .ear-l{animation:earL .4s ease-in-out 4}
.a-dance .ear-r{animation:earR .4s ease-in-out 4}
@keyframes earL{0%,100%{transform:none}50%{transform:rotate(-18deg)}}
@keyframes earR{0%,100%{transform:none}50%{transform:rotate(18deg)}}
.a-nope{animation:nope 1.1s ease-in-out}
@keyframes nope{0%,100%{transform:none}15%{transform:translateX(-7px) rotate(-3deg)}35%{transform:translateX(7px) rotate(3deg)}55%{transform:translateX(-5px) rotate(-2deg)}75%{transform:translateX(3px) rotate(1deg)}}
.a-shiver{animation:shiver .9s ease-in-out}
@keyframes shiver{0%,100%{transform:none}10%{transform:scale(.94, .9) translateY(6px)}20%,40%,60%{transform:scale(.94, .9) translate(-2px, 6px)}30%,50%,70%{transform:scale(.94, .9) translate(2px, 6px)}85%{transform:scale(1.03, .98)}}
.a-puff{animation:puff 1.1s ease-in-out}
/* Mareo: se tambalea, ojos en espiral y estrellitas girando sobre la cabeza. */
.a-dizzy{animation:dizzy 2.4s ease-in-out}
@keyframes dizzy{
  0%,100%{transform:none}
  10%{transform:rotate(-12deg) translateX(-6px)} 22%{transform:rotate(11deg) translateX(6px)}
  34%{transform:rotate(-10deg) translateX(-5px)} 46%{transform:rotate(9deg) translateX(5px)}
  58%{transform:rotate(-7deg) translateX(-3px)} 70%{transform:rotate(5deg) translateX(3px)}
  82%{transform:rotate(-3deg)} 92%{transform:rotate(2deg)}
}
.face .e-dizzy, .face .orbit{display:none}
.face[data-eyes="dizzy"] .e-dizzy{display:inline}
.face.dizzy .orbit{display:inline}
.face .spiral{transform-box:fill-box; transform-origin:center; animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.face .ostar{animation:orbit 1.3s linear infinite}
.face .ostar:nth-child(2){animation-delay:-.43s}
.face .ostar:nth-child(3){animation-delay:-.86s}
@keyframes orbit{
  0%{transform:translate(-56px, 0) scale(.8); opacity:.9}
  25%{transform:translate(0, 9px) scale(1.15); opacity:1}
  50%{transform:translate(56px, 0) scale(.8); opacity:.9}
  75%{transform:translate(0, -9px) scale(.55); opacity:.45}
  100%{transform:translate(-56px, 0) scale(.8); opacity:.9}
}
/* Alegría al tocar al personaje: salta, se estira y aletea. */
.a-joy{animation:joy 1.3s cubic-bezier(.3,1.2,.5,1)}
@keyframes joy{
  0%,100%{transform:none}
  12%{transform:translateY(8px) scale(1.12, .84)}
  30%{transform:translateY(-34px) scale(.92, 1.1) rotate(-4deg)}
  46%{transform:translateY(4px) scale(1.1, .88)}
  62%{transform:translateY(-22px) scale(.96, 1.06) rotate(5deg)}
  78%{transform:translateY(0) scale(1.05, .95)}
  90%{transform:rotate(-2deg)}
}
.a-joy .ear-l{animation:earL .32s ease-in-out 4}
.a-joy .ear-r{animation:earR .32s ease-in-out 4}
.a-joy .tuft{animation:tuft .32s ease-in-out 4}
.a-boing{animation:boing .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes boing{0%,100%{transform:none}35%{transform:scale(1.12, .86)}70%{transform:scale(.95, 1.06)}}
.pet{position:absolute; inset:4%; border:0; border-radius:40%; background:transparent; cursor:pointer; z-index:3; pointer-events:auto; touch-action:manipulation}
.pet:focus{outline:none}
.pet:focus-visible{outline:4px solid #fff; outline-offset:2px}
.heart{color:#FF5C8A !important}
@keyframes puff{0%,100%{transform:none}25%,70%{transform:scale(1.07)}}

.note{
  position:absolute; left:50%; top:30%; font-family:var(--display); font-weight:700; font-size:30px;
  color:var(--c); text-shadow:0 2px 0 #fff, 0 0 10px rgba(255,255,255,.9); pointer-events:none; z-index:3;
  animation:float 1.1s ease-out forwards;
}
@keyframes float{0%{opacity:0; transform:translate(-50%, 0) scale(.6)}20%{opacity:1}100%{opacity:0; transform:translate(calc(-50% + var(--dx)), var(--dy, -90px)) scale(1.15) rotate(var(--rot))}}

.dots{display:flex; justify-content:center; flex-wrap:wrap; gap:6px; min-height:12px; padding-inline:8px}
.dot{width:11px; height:11px; border-radius:6px; background:rgba(255,255,255,.45); box-shadow:inset 0 1px 2px rgba(59,63,117,.2); transition:background .15s, transform .2s}
.dot.on{background:#fff; transform:scale(1.2)}
.dot.sep{width:4px; background:transparent; box-shadow:none}

/* ---------- Menú: modo, nivel, canción ---------- */
.menu{display:flex; flex-direction:column; gap:10px}
.playing .menu{display:none}
.seg{
  position:relative; display:grid; grid-auto-flow:column; grid-auto-columns:1fr; padding:5px; border-radius:26px;
  background:rgba(255,255,255,.42); border:1px solid var(--glass-line);
  box-shadow:inset 0 2px 6px rgba(59,63,117,.14);
}
.seg .pill{
  position:absolute; top:5px; bottom:5px; left:5px; border-radius:21px;
  background:linear-gradient(180deg, #fff, var(--pill-bg)); box-shadow:0 4px 0 var(--pill-sh), 0 6px 14px rgba(59,63,117,.18);
  transition:transform .34s cubic-bezier(.3,1.35,.5,1);
}
.seg button{position:relative; z-index:1; border:0; background:transparent; min-height:44px; border-radius:21px; cursor:pointer;
  font-family:var(--display); font-weight:600; font-size:17px; color:var(--ink); opacity:.75; transition:color .2s, opacity .2s}
.seg button[aria-pressed="true"]{color:var(--accent-text); opacity:1}
.seg button:focus{outline:none}
.seg button:focus-visible{outline:3px solid #fff; outline-offset:-3px}
.songs{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.song{
  border:1px solid var(--glass-line); border-radius:18px; padding:8px 14px; cursor:pointer; min-height:44px;
  background:var(--glass); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  display:flex; flex-direction:column; align-items:flex-start; gap:1px; text-align:left;
  box-shadow:0 4px 12px rgba(59,63,117,.12); transition:transform .1s;
}
.song:active{transform:scale(.95)}
.song b{font-family:var(--display); font-weight:600; font-size:15px; color:var(--ink)}
.song span{font-size:11px; font-weight:700; color:var(--ink-soft)}
.song[aria-pressed="true"]{background:#fff; border-color:#fff; box-shadow:0 4px 0 var(--pill-sh), 0 0 0 3px var(--ring)}
.song .done{color:var(--mint-edge)}
.hint{text-align:center; font-size:13px; font-weight:700; color:var(--ink); opacity:.85; margin:0; line-height:1.45}

.go{
  align-self:center; width:min(100%, 320px); min-height:62px; border:0; border-radius:31px; cursor:pointer;
  font-family:var(--display); font-weight:700; font-size:23px; color:#fff; letter-spacing:.3px;
  background:linear-gradient(180deg, var(--go1), var(--go2));
  box-shadow:0 7px 0 var(--go-edge), 0 16px 26px rgba(59,63,117,.25), inset 0 2px 0 rgba(255,255,255,.5);
  text-shadow:0 2px 0 var(--go-text-sh); transition:transform .07s, box-shadow .07s;
}
.go:active{transform:translateY(5px); box-shadow:0 2px 0 var(--go-edge), 0 6px 12px rgba(59,63,117,.2), inset 0 2px 0 rgba(255,255,255,.5)}
.playing .go{min-height:50px; font-size:18px; width:min(100%, 220px); background:linear-gradient(180deg, #A3A8DD, #8E93CB); box-shadow:0 6px 0 var(--lavender-edge), 0 12px 20px rgba(59,63,117,.2), inset 0 2px 0 rgba(255,255,255,.5); text-shadow:0 2px 0 rgba(59,63,117,.35)}
.playing .go:active{box-shadow:0 1px 0 var(--lavender-edge)}
.go:focus{outline:none}
.go:focus-visible{outline:4px solid #fff; outline-offset:4px}

.over{
  position:absolute; inset:10% 4%; z-index:5; border-radius:32px; padding:20px 16px; box-sizing:border-box;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center;
  background:rgba(255,255,255,.76); border:1px solid #fff; -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
  box-shadow:0 20px 40px rgba(59,63,117,.25); animation:pop .4s cubic-bezier(.3,1.5,.5,1); cursor:pointer;
}
.over h2{margin:0; font-family:var(--display); font-weight:700; font-size:26px; color:var(--ink); text-wrap:balance}
.over p{margin:0; font-size:14px; font-weight:700; color:var(--ink-soft)}
.over .big{font-family:var(--display); font-weight:700; font-size:54px; line-height:1; color:var(--accent-text)}
@keyframes pop{from{transform:scale(.85); opacity:0}to{transform:none; opacity:1}}

/* Personajes: Slidy (rosa, orejitas) y Bizy (amarilla, copete y alitas). */
.face .char-bizy{display:none}
.face[data-char="bizy"] .char-bizy{display:inline}
.face[data-char="bizy"] .char-slidy{display:none}
.face .pup{fill:#232B6E}
.face .pup-stroke{stroke:#232B6E}
.face[data-char="bizy"] .pup-stroke{stroke:#5A3B1C}
.face .brow{stroke:#2E3A8C}
.face .nose{fill:#2E3A8C}
.face .beak{display:none}
.face[data-char="bizy"] .beak{display:inline}
.face[data-char="bizy"] .nose{display:none}
.face .cheek{fill:#FFC3DA}
.face .e-happy, .face .e-squeeze, .face .m-smile, .face .m-wobble{stroke:#232B6E}
.face[data-char="bizy"] .pup{fill:#5A3B1C}
.face[data-char="bizy"] .brow{stroke:#A8650E}
.face[data-char="bizy"] .nose{fill:#FF8A4C}
.face[data-char="bizy"] .cheek{fill:#FFA3B5}
.face[data-char="bizy"] .e-happy, .face[data-char="bizy"] .e-squeeze, .face[data-char="bizy"] .m-smile, .face[data-char="bizy"] .m-wobble{stroke:#5A3B1C}
.face .char-bizy .ear{transform-origin:50% 15%}
.face .arm{transform-box:fill-box}
.face .char-slidy .arm-l{transform-origin:85% 15%}
.face .char-slidy .arm-r{transform-origin:15% 15%}
.a-dance .char-slidy .arm-l, .a-joy .char-slidy .arm-l{animation:armL .32s ease-in-out 5}
.a-dance .char-slidy .arm-r, .a-joy .char-slidy .arm-r{animation:armR .32s ease-in-out 5}
@keyframes armL{0%,100%{transform:none}50%{transform:rotate(40deg)}}
@keyframes armR{0%,100%{transform:none}50%{transform:rotate(-40deg)}}

.scene{position:absolute; inset:0; pointer-events:none}

.wave{width:34px; height:34px; vertical-align:-8px; margin-right:6px}

/* ---------- Modo Palabras ---------- */

.arrow{
  width:52px; height:52px; flex-shrink:0; border:0; border-radius:26px; cursor:pointer; color:var(--accent-text);

}

.opts{display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%}
.opt{
  min-height:118px; border:0; border-radius:24px; cursor:pointer; background:#fff;
  box-shadow:0 6px 0 rgba(142,147,203,.45), 0 10px 18px rgba(59,63,117,.14);

}
.opt .emo{font-size:62px}

.opt .xylo{width:80px; height:66px}

/* ---------- Horarios: dormir y comer ---------- */
.face .e-sleep{display:none}
.face[data-eyes="sleep"] .e-sleep{display:inline}
.face .e-sleep{stroke:#3B3F75}
.face[data-char="bizy"] .e-sleep{stroke:#5A3B1C}
.rest{
  position:fixed; inset:0; z-index:25; overflow:hidden; box-sizing:border-box; padding:16px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; animation:fade .6s;
}
.rest.night{background:#1B2350 linear-gradient(180deg, #121842 0%, #252D68 45%, #454A8C 80%, #6A66A6 100%); color:#fff}
.rest.meal{background:var(--bg-base) var(--bg)}
.sky{position:absolute; inset:0; pointer-events:none}
.tw{position:absolute; border-radius:50%; background:#fff; box-shadow:0 0 6px 1px rgba(255,255,255,.8); animation:twinkle var(--d) ease-in-out infinite var(--dl)}
@keyframes twinkle{0%,100%{opacity:.15; transform:scale(.6)}50%{opacity:1; transform:scale(1.15)}}
.shoot{position:absolute; top:12%; left:-10%; width:90px; height:2px; border-radius:2px; background:linear-gradient(90deg, transparent, #fff); opacity:0; animation:shoot 7s ease-in infinite 2s}
@keyframes shoot{0%,88%{opacity:0; transform:translate(0, 0) rotate(18deg)}90%{opacity:1}100%{opacity:0; transform:translate(520px, 170px) rotate(18deg)}}
.moon{position:absolute; top:8%; right:12%; width:66px; height:66px; border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #FFFBE6, #FFE58F 70%); box-shadow:0 0 40px 10px rgba(255,236,160,.35)}
.moon::after{content:""; position:absolute; width:14px; height:14px; border-radius:50%; background:rgba(214,186,90,.35); top:38px; left:18px; box-shadow:22px -16px 0 -3px rgba(214,186,90,.3)}
.rest .pair{position:relative; z-index:1; margin-bottom:22px; display:flex; align-items:flex-end; justify-content:center; gap:8px; width:min(100%, 380px); cursor:pointer}
.rest .who{position:relative; width:47%}
.rest .who svg{display:block; width:100%; height:auto; overflow:visible; filter:drop-shadow(0 12px 16px rgba(10,14,40,.3))}
.breathe{animation:breathe 3.4s ease-in-out infinite; transform-origin:50% 90%}
.who:nth-child(2) .breathe{animation-delay:-1.7s}
@keyframes breathe{50%{transform:scale(1.04, .965)}}
.zzz{position:absolute; top:2%; right:6%; font-family:var(--display); font-weight:700; font-size:24px; color:#fff; opacity:0; animation:zzz 3.6s ease-in infinite; text-shadow:0 0 8px rgba(255,255,255,.6)}

.bowl{position:absolute; bottom:-30px; left:50%; transform:translateX(-50%); font-size:clamp(40px, 13vw, 56px); filter:drop-shadow(0 6px 6px rgba(59,63,117,.25))}
.bob{animation:bob 1s ease-in-out infinite; transform-origin:50% 90%}

.rest .msg{position:relative; z-index:1; max-width:340px; padding:18px 22px; border-radius:28px; background:rgba(255,255,255,.88); box-shadow:0 12px 30px rgba(59,63,117,.2)}

.gate{position:fixed; inset:0; z-index:40; background:rgba(20,24,60,.55); display:flex; align-items:center; justify-content:center; padding:16px; animation:fade .2s}

/* ---------- Ajustes ---------- */
.sheet-bg{position:fixed; inset:0; z-index:20; background:rgba(59,63,117,.35); display:flex; align-items:flex-end; justify-content:center; padding-inline:12px; animation:fade .2s}

  margin-bottom:max(12px, env(safe-area-inset-bottom, 0px)); padding:18px 18px 20px; border-radius:30px;

.sheet .two{display:grid; grid-template-columns:1fr 1fr; gap:8px}

.sheet .tog span, .tog span{display:flex; width:56px; height:32px; border-radius:16px; background:rgba(142,147,203,.35); padding:4px; box-sizing:border-box; display:flex; transition:background .2s}

.records{display:grid; grid-template-columns:repeat(4, 1fr); gap:8px}
.rec{background:#fff; border-radius:16px; padding:8px 4px; text-align:center; box-shadow:0 3px 0 rgba(142,147,203,.4)}
.rec b{display:block; font-family:var(--display); font-size:22px; color:var(--accent-text); line-height:1.1}
.rec span{font-size:10.5px; font-weight:800; color:var(--ink-soft)}
.soft{border:0; border-radius:18px; min-height:46px; cursor:pointer; font-family:var(--display); font-weight:600; font-size:16px;
  background:#fff; color:var(--ink); box-shadow:0 4px 0 rgba(142,147,203,.45); transition:transform .07s}
.soft:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(142,147,203,.45)}
.soft.warn{color:var(--accent-text)}
.sheet .go{width:100%; min-height:54px; font-size:20px}

  .tw,.shoot,.breathe,.bob,.zzz,.cloud,.spark,.logo,.waving .arm-r,.chew .arm-r,
  .a-sing,.a-nod,.a-dance,.a-nope,.a-shiver,.a-puff,.a-dizzy,.a-joy,.a-boing,.face .spiral,.face .ostar,.a-dance .ear-l,.a-dance .ear-r,.over,.pad,.sheet,.pad.hint::after{animation:none}
  .note{animation-duration:.01s}
}

.devnote{margin:-4px 0 14px; padding:10px 14px; border-radius:14px; background:#FFF3C4; color:#6B5300; font:700 14px 'Nunito', sans-serif}

<script>
(function () {
  // ---------- Datos ----------
  // Posiciones en sentido horario desde arriba. Con 8 teclas suena la escala de Do a Do.
  var SCALE = [523.25, 587.33, 659.25, 698.46, 783.99, 880.0, 987.77, 1046.5];
  var NAMES = ['Do', 'Re', 'Mi', 'Fa', 'Sol', 'La', 'Si', 'Do'];
  // Con 4 teclas (arriba, derecha, abajo, izquierda): Do, Mi, Sol, La, que siempre suenan bien juntas.
  var FOUR = { 0: 523.25, 2: 659.25, 4: 783.99, 6: 880.0 };
  var FOUR_NAMES = { 0: 'Do', 2: 'Mi', 4: 'Sol', 6: 'La' };
  var ICONS = ['Corazón', 'Flor', 'Rayo', 'Hoja', 'Luna', 'Gota', 'Estrella', 'Nube'];
  var LOOK = [[0, -7], [6, -6], [8, 0], [6, 6], [0, 7], [-6, 6], [-8, 0], [-6, -6]];
  var COLORS = ['var(--coral)', 'var(--orange)', 'var(--butter)', 'var(--lime)', 'var(--mint)', 'var(--sky)', 'var(--lavender)', 'var(--violet)'];

  var MODES = [{ key: 'mem', label: 'Memorizar' }, { key: 'learn', label: 'Aprender' }, { key: 'words', label: 'Palabras' }];
  var WORD_LEVELS = [{ label: 'Letras' }, { label: 'Palabras' }, { label: 'Juego' }];
  var LEVELS = [{ key: 'facil', label: 'Fácil' }, { key: 'normal', label: 'Normal' }, { key: 'dificil', label: 'Difícil' }];
  var LEVEL_HINT = {
    mem: ['Slidy mira la tecla que debes tocar. 4 teclas.', 'Slidy ya no te da pistas. 4 teclas.', '8 teclas y sin pistas. ¡Para expertos!'],
    learn: ['Canciones cortas. Se aprenden por partes.', 'Canciones medianas.', 'Canciones largas.'],
    words: ['Toca el dibujo para escuchar la letra otra vez.', 'Toca cada sílaba y luego el dibujo.', 'Slidy dice una palabra. ¡Encuéntrala!']
  };

  // Melodías tradicionales. "-" alarga la nota un tiempo. "Do2" es el Do agudo.
  var EST1 = 'Do Do Sol Sol La La Sol-', EST2 = 'Fa Fa Mi Mi Re Re Do-', EST3 = 'Sol Sol Fa Fa Mi Mi Re-';
  var SONGS = [
    { id: 'estrellita', name: 'Estrellita', level: 0, phrases: [EST1, EST2] },
    { id: 'martinillo', name: 'Martinillo', level: 0, phrases: ['Do Re Mi Do', 'Do Re Mi Do', 'Mi Fa Sol-', 'Mi Fa Sol-'] },
    { id: 'mary', name: 'Mary tenía un corderito', level: 1, phrases: ['Mi Re Do Re Mi Mi Mi-', 'Re Re Re- Mi Sol Sol-', 'Mi Re Do Re Mi Mi Mi Mi', 'Re Re Mi Re Do--'] },
    { id: 'cascabel', name: 'Cascabel', level: 1, phrases: ['Mi Mi Mi- Mi Mi Mi-', 'Mi Sol Do Re Mi--', 'Fa Fa Fa Fa Fa Mi Mi Mi', 'Mi Re Re Mi Re- Sol-'] },
    { id: 'rema', name: 'Rema, rema', level: 1, phrases: ['Do Do Do Re Mi-', 'Mi Re Mi Fa Sol--', 'Do2 Do2 Do2 Sol Sol Sol Mi Mi Mi Do Do Do', 'Sol Fa Mi Re Do--'] },
    { id: 'himno', name: 'Himno de la alegría', level: 2, phrases: ['Mi Mi Fa Sol Sol Fa Mi Re', 'Do Do Re Mi Mi Re Re-', 'Mi Mi Fa Sol Sol Fa Mi Re', 'Do Do Re Mi Re Do Do-'] },
    { id: 'estrellita2', name: 'Estrellita completa', level: 2, phrases: [EST1, EST2, EST3, EST3, EST1, EST2] }
  ];
  var IDX = { Do: 0, Re: 1, Mi: 2, Fa: 3, Sol: 4, La: 5, Si: 6, Do2: 7 };
  SONGS.forEach(function (s) {
    s.parsed = s.phrases.map(function (ph) {
      return ph.trim().split(/\s+/).map(function (tok) {
        var m = tok.match(/^([A-Za-z0-9]+)(-*)$/);
        return { i: IDX[m[1]], beats: 1 + m[2].length };
      });
    });
    s.count = s.parsed.reduce(function (n, p) { return n + p.length; }, 0);
  });

  var FAILS = [
    { name: 'squeeze', text: '¡Uy! Casi. Escucha otra vez' },
    { name: 'nope', text: 'Nop, esa no era. ¡Otra vez!' },
    { name: 'puff', text: '¡Ay! Vamos de nuevo, tú puedes' }
  ];
  var CHEERS = ['¡Muy bien!', '¡Eso es!', '¡Bravo!', '¡Qué oído!', '¡Genial!'];

  // ---------- Preferencias (solo en este navegador) ----------
  var prefs = { sound: true, volume: 1, vibe: true, speed: 1, danceEvery: 3, mode: 0, level: 0, song: 'estrellita',
    char: 'slidy', pal: 'rosa', voice: true, welcomed: false,
    routine: { on: true, sleep: '21:00', wake: '06:30', breakfast: '07:00', lunch: '12:30', dinner: '18:30' } };
  var records = { facil: 0, normal: 0, dificil: 0, learned: {} };
  try { Object.assign(prefs, JSON.parse(localStorage.getItem('slidy-prefs') || '{}')); } catch (e) {}
  prefs.voice = false; // Voces apagadas por ahora: el juego está en desarrollo.
  try { Object.assign(records, JSON.parse(localStorage.getItem('slidy-records') || '{}')); } catch (e) {}
  function savePrefs() { try { localStorage.setItem('slidy-prefs', JSON.stringify(prefs)); } catch (e) {} }
  function saveRecords() { try { localStorage.setItem('slidy-records', JSON.stringify(records)); } catch (e) {} }

  // ---------- Elementos ----------
  var $ = function (id) { return document.getElementById(id); };
  var app = $('app'), stage = $('stage'), face = $('face'), wrap = $('wrap');
  var statusEl = $('status'), roundEl = $('round'), roundLbl = $('roundLbl'), starsEl = $('stars');
  var dotsEl = $('dots'), goBtn = $('go'), hintEl = $('hint'), songsEl = $('songs');
  var pads = [].slice.call(document.querySelectorAll('.pad'));

  // ---------- Personajes y paletas ----------
  var CHARS = {
    slidy: { name: 'Slidy', pitch: 1.45, other: 'bizy' },
    bizy: { name: 'Bizy', pitch: 1.8, other: 'slidy' }
  };
  var PALS = [{ key: 'rosa', label: 'Rosa' }, { key: 'azul', label: 'Azul' }];
  function who() { return CHARS[prefs.char] || CHARS.slidy; }
  function named(t) { return t.replace(/Slidy/g, who().name); }
  function applyPal() { document.documentElement.setAttribute('data-pal', prefs.pal); }
  if (prefs.char !== 'slidy' && prefs.char !== 'bizy') prefs.char = 'bizy'; // antes se llamaba de otra forma
  applyPal();

  // Copia de la cara para la miniatura y la bienvenida.
  function cloneFace(char) {
    var f = face.cloneNode(true);
    f.removeAttribute('id');
    var d = f.querySelector('defs'); if (d) d.remove();
    f.setAttribute('aria-hidden', 'true');
    f.setAttribute('data-char', char);
    f.setAttribute('data-eyes', 'open'); f.setAttribute('data-mouth', 'smile'); f.setAttribute('data-brows', 'neutral');
    f.style.removeProperty('--px'); f.style.removeProperty('--py');
    f.classList.remove('blink', 'puff');
    return f;
  }
  var mini = null;
  function drawChar() {
    face.setAttribute('data-char', prefs.char);
    document.documentElement.setAttribute('data-char', prefs.char);
    if (mini) mini.remove();
    mini = cloneFace(prefs.char);
    mini.classList.add('mini');
    $('brand').insertBefore(mini, $('brand').firstChild);
    $('charName').textContent = who().name;
    if ($('pet')) petLabel();
    $('brand').setAttribute('aria-label', 'Jugando con ' + who().name + '. Cambiar a ' + CHARS[who().other].name);
  }
  drawChar();

  // ---------- Voz: los personajes leen en voz alta para quien aún no lee ----------
  var synth = window.speechSynthesis, esVoice = null, flapT = null;
  function pickVoice() {
    if (!synth) return;
    var vs = synth.getVoices().filter(function (v) { return /^es/i.test(v.lang); });
    var pref = ['es-419', 'es-MX', 'es-US', 'es-CO', 'es-ES'];
    esVoice = null;
    for (var k = 0; k < pref.length && !esVoice; k++) esVoice = vs.filter(function (v) { return v.lang === pref[k]; })[0] || null;
    if (!esVoice) esVoice = vs[0] || null;
  }
  if (synth) { pickVoice(); try { synth.addEventListener('voiceschanged', pickVoice); } catch (e) {} }
  function speak(text, opts) {
    opts = opts || {};
    return new Promise(function (done) {
      if (!prefs.voice || !synth || !text) return done();
      var c = CHARS[opts.char || prefs.char] || CHARS.slidy;
      var finished = false;
      function end() { if (finished) return; finished = true; clearInterval(flapT); if (opts.face) opts.face.setAttribute('data-mouth', 'smile'); done(); }
      try {
        synth.cancel();
        var u = new SpeechSynthesisUtterance(text.replace(/[…]/g, '.'));
        u.lang = esVoice ? esVoice.lang : 'es-419';
        if (esVoice) u.voice = esVoice;
        u.pitch = c.pitch * (opts.pitchMul || 1); u.rate = opts.rate || 1.0; u.volume = opts.volume == null ? 1 : opts.volume;
        u.onend = end; u.onerror = end;
        // La boca se mueve mientras habla.
        var f = opts.face || (game.phase === 'menu' || game.phase === 'turn' ? face : null);
        opts.face = f;
        if (f) {
          var open = false;
          clearInterval(flapT);
          flapT = setInterval(function () { open = !open; if (f.getAttribute('data-eyes') !== 'squeeze') f.setAttribute('data-mouth', open ? 'o' : 'smile'); }, 150);
        }
        synth.speak(u);
        setTimeout(end, Math.min(6000, 900 + text.length * 75));
      } catch (e) { end(); }
    });
  }

  // ---------- Estado del juego ----------
  var game = { phase: 'menu', run: 0 };
  // mem: seq, step, round, lives, streak · learn: song, phrase, step
  function isLearn() { return prefs.mode === 1; }
  function isWords() { return prefs.mode === 2; }
  function eight() { return isLearn() || prefs.level === 2; }
  function active() { return eight() ? [0, 1, 2, 3, 4, 5, 6, 7] : [0, 2, 4, 6]; }
  function freq(i) { return eight() ? SCALE[i] : FOUR[i]; }
  function noteName(i) { return eight() ? NAMES[i] : FOUR_NAMES[i]; }

  // ---------- Sonido: glockenspiel sintetizado ----------

      '<label class="lbl">Ver cómo se ve</label><div class="previews">' +
      '<button class="soft" data-k="sleep">Noche</button><button class="soft" data-k="breakfast">Desayuno</button>' +
      '<button class="soft" data-k="lunch">Almuerzo</button><button class="soft" data-k="dinner">Cena</button></div>' +
      '<button class="go" id="rDone">Listo</button></div>';
    document.body.appendChild(bg);
    $('tRoutine').addEventListener('click', function () {
      r.on = !r.on; savePrefs(); $('tRoutine').setAttribute('aria-pressed', String(r.on));
    });
    [['rSleep', 'sleep'], ['rWake', 'wake'], ['rBreakfast', 'breakfast'], ['rLunch', 'lunch'], ['rDinner', 'dinner']].forEach(function (x) {
      $(x[0]).addEventListener('change', function () { if ($(x[0]).value) { r[x[1]] = $(x[0]).value; savePrefs(); } });
    });
    [].slice.call(bg.querySelectorAll('.previews button')).forEach(function (b) {
      b.addEventListener('click', function () { bg.remove(); unlock(); showRest(b.getAttribute('data-k'), true); });
    });
    $('rDone').addEventListener('click', function () { bg.remove(); checkRoutine(); });
    bg.addEventListener('click', function (e) { if (e.target === bg) { bg.remove(); checkRoutine(); } });
  }
  setInterval(checkRoutine, 20000);

  // ---------- Mareo: dos teclas alternadas muy rápido ----------
  // Si en 3,5 segundos se tocan 8 veces dos teclas, una y otra, el personaje se marea.
  var taps = [], dizzyUntil = 0, dizzyT = null;
  function checkDizzy(i) {
    var now = performance.now();
    if (now < dizzyUntil) return false;
    taps.push({ i: i, t: now });
    taps = taps.filter(function (x) { return now - x.t < 3500; }).slice(-8);
    if (taps.length < 8) return false;
    var a = taps[0].i, b = taps[1].i;
    if (a === b) return false;
    for (var k = 0; k < taps.length; k++) if (taps[k].i !== (k % 2 ? b : a)) return false;
    taps = [];
    return true;
  }
  function dizzy() {
    var my = ++game.run;
    game.phase = 'busy';
    dizzyUntil = performance.now() + 4500;
    clearTimeout(mouthT);
    face.classList.add('dizzy');
    setFace('dizzy', 'wobble', 'sad');
    anim('dizzy');
    // Un "uiii" que baja, como un trompo que se frena.
    [1046.5, 987.77, 880, 783.99, 698.46, 659.25, 587.33, 523.25].forEach(function (f, k) { bell(f, k * 0.07, 0.45); });
    buzz([20, 40, 20, 40, 20]);
    say('¡Uy! ¡Me mareo!');
    clearTimeout(dizzyT);
    dizzyT = setTimeout(function () {
      face.classList.remove('dizzy');
      if (my !== game.run) return;
      setFace('open', 'smile', 'up'); anim('nope');
      game.phase = 'menu';
      say('¡Uf! Ya pasó');
      setTimeout(function () { if (game.phase === 'menu') setFace('open', 'smile', 'neutral'); }, 1100);
    }, 2500);
  }

  // ---------- Cosquillas: tocar al personaje ----------
  var JOY = ['¡Je, je! ¡Cosquillas!', '¡Me encanta jugar contigo!', '¡Yupi!', '¡Eres mi mejor amigo!', '¡Otra vez, otra vez!'];
  var joyN = 0, joyBusy = false;
  function hearts(n) {
    for (var k = 0; k < n; k++) (function (k) {
      setTimeout(function () {
        var h = document.createElement('span');
        h.className = 'note heart'; h.textContent = '♥';
        h.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
        h.style.setProperty('--dy', (-90 - Math.random() * 70) + 'px');
        h.style.setProperty('--rot', (Math.random() * 50 - 25) + 'deg');
        h.style.fontSize = (22 + Math.random() * 16) + 'px';
        stage.appendChild(h);
        setTimeout(function () { h.remove(); }, 1200);
      }, k * 90);
    })(k);
  }
  function giggle() { [1318.5, 1567.98, 1318.5, 1760].forEach(function (f, k) { bell(f, k * 0.08, 0.4); }); }
  $('pet').addEventListener('click', function () {
    unlock();
    if (game.phase === 'turn') { anim('boing'); giggle(); hearts(2); return; } // durante el turno, solo un saltito
    if (game.phase !== 'menu' || joyBusy) return;
    joyBusy = true;
    closeOver();
    var my = ++game.run;
    clearTimeout(mouthT);
    look(null);
    setFace('happy', 'big', 'up');
    anim('joy'); giggle(); buzz([15, 30, 15]); hearts(9);
    say(JOY[joyN++ % JOY.length]);
    setTimeout(function () {
      joyBusy = false;
      if (my === game.run && game.phase === 'menu') setFace('open', 'smile', 'neutral');
    }, 1400);
  });
  function petLabel() { $('pet').setAttribute('aria-label', 'Hacer cosquillas a ' + who().name); }

  // ---------- Errores: tres gestos amables ----------
  async function failGesture(then, gentle) {
    var my = ++game.run;
    game.phase = 'busy';
    jingleFail(); buzz([40, 50, 40]);
    var f = FAILS[game.fail++ % FAILS.length];
    clearTimeout(mouthT);
    look(null);
    if (f.name === 'squeeze') { setFace('squeeze', 'wobble', 'sad'); anim('shiver'); }
    if (f.name === 'nope') { setFace('open', 'smile', 'sad'); anim('nope'); }
    if (f.name === 'puff') { lookUp(); setFace('open', 'wobble', 'sad'); face.classList.add('puff'); anim('puff'); }
    var lastLife = !gentle && game.lives === 1;
    say(lastLife ? '¡Uf! Se acabaron las estrellas' : f.text);
    await sleep(1300);
    face.classList.remove('puff');
    if (my !== game.run) return;
    setFace('open', 'smile', 'neutral'); look(null);
    then();
  }

  // ---------- Inicio y fin ----------
  function startGame() {
    unlock();
    closeOver();
    app.classList.add('playing');
    goBtn.textContent = 'Terminar';
    drawPads();
    if (isLearn()) learnStart(); else memStart();
  }
  function endGame(msg) {
    game.run++;
    game.phase = 'menu';
    setHint(null);
    app.classList.remove('playing');
    drawMenu();
    setFace('happy', 'smile', 'up'); anim('nod');
    setTimeout(function () { if (game.phase === 'menu') setFace('open', 'smile', 'neutral'); }, 1200);
    say(msg);
  }
  function showOver(html) {
    closeOver();
    var o = document.createElement('div');
    o.className = 'over'; o.id = 'over'; o.innerHTML = html + '<p style="opacity:.7">Toca para cerrar</p>';
    o.addEventListener('click', closeOver);
    stage.appendChild(o);
  }
  function closeOver() { var o = $('over'); if (o) o.remove(); }
  goBtn.addEventListener('click', function () {
    if (app.classList.contains('playing')) endGame('Cuando quieras seguimos');
    else startGame();
  });

  // ---------- Ajustes ----------
  function openSettings() {
    if ($('sheet')) return;
    var bg = document.createElement('div');
    bg.className = 'sheet-bg'; bg.id = 'sheet';
    bg.innerHTML =
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="stitle">' +
      '<h2 id="stitle">Ajustes</h2>' +
      '<p class="devnote">Slidy está en desarrollo. Esta es una versión de prueba.</p>' +
      '<label class="lbl">Personaje</label><div class="seg" id="sChar"></div>' +
      '<label class="lbl">Colores</label><div class="seg" id="sPal"></div>' +
      '<div class="row"><div><b>Sonido</b><span>Las teclas suenan como un glockenspiel</span></div><button class="tog" id="tSound" aria-label="Sonido"><span></span></button></div>' +
      '<label class="lbl">Volumen</label><div class="seg" id="sVol"></div>' +
      '<div class="row"><div><b>Vibración</b><span>Un pulso al tocar, en móviles compatibles</span></div><button class="tog" id="tVibe" aria-label="Vibración"><span></span></button></div>' +
      '<label class="lbl">Velocidad de ' + who().name + '</label><div class="seg" id="sSpeed"></div>' +
      '<label class="lbl">' + who().name + ' baila cada</label><div class="seg" id="sDance"></div>' +
      '<label class="lbl">Récords en Memorizar</label>' +
      '<div class="records"><div class="rec"><b>' + (records.facil || 0) + '</b><span>Fácil</span></div><div class="rec"><b>' + (records.normal || 0) + '</b><span>Normal</span></div><div class="rec"><b>' + (records.dificil || 0) + '</b><span>Difícil</span></div><div class="rec"><b>' + Object.keys(records.learned).length + '/' + SONGS.length + '</b><span>Canciones</span></div></div>' +
      '<button class="soft" id="routineBtn">Horarios de descanso (para adultos)</button>' +
      '<div class="two"><button class="soft" id="again">Ver la bienvenida</button><button class="soft warn" id="wipe">Borrar récords</button></div>' +
      '<button class="go" id="done">Listo</button>' +
      '</div>';
    document.body.appendChild(bg);
    function tog(id, key) {
      var b = $(id);
      b.setAttribute('aria-pressed', String(!!prefs[key]));
      b.addEventListener('click', function () {
        prefs[key] = !prefs[key]; savePrefs(); b.setAttribute('aria-pressed', String(prefs[key]));
        if (key === 'sound') speak(prefs.sound ? 'Sonido activado' : 'Sonido apagado');
        if (key === 'vibe') speak(prefs.vibe ? 'Vibración activada' : 'Vibración apagada');
        if (key === 'sound' && prefs.sound) { unlock(); bell(783.99, 0, 0.6); }
        if (key === 'vibe') buzz(30);
      });
    }
    tog('tSound', 'sound'); tog('tVibe', 'vibe');
    segmented($('sChar'), [{ label: 'Slidy' }, { label: 'Bizy' }], prefs.char === 'bizy' ? 1 : 0, function (i) {
      close(); switchChar(i ? 'bizy' : 'slidy');
    });
    segmented($('sPal'), PALS, prefs.pal === 'azul' ? 1 : 0, function (i) {
      prefs.pal = PALS[i].key; savePrefs(); applyPal(); speak(PALS[i].label);
    });
    $('again').addEventListener('click', function () { close(); welcome(true); });
    $('routineBtn').addEventListener('click', function () { close(); parentGate(openRoutine); });
    var VOL = [0.45, 1, 1.6];
    segmented($('sVol'), [{ label: 'Bajo' }, { label: 'Medio' }, { label: 'Alto' }], Math.max(0, VOL.indexOf(prefs.volume)), function (i) {
      prefs.volume = VOL[i]; savePrefs(); if (master) master.gain.value = 0.55 * prefs.volume; unlock(); bell(659.25, 0, 0.8);
    });
    var SPD = [1.35, 1, 0.75];
    segmented($('sSpeed'), [{ label: 'Lenta' }, { label: 'Normal' }, { label: 'Rápida' }], Math.max(0, SPD.indexOf(prefs.speed)), function (i) { prefs.speed = SPD[i]; savePrefs(); });
    var DN = [3, 5, 10];
    segmented($('sDance'), [{ label: '3 melodías' }, { label: '5' }, { label: '10' }], Math.max(0, DN.indexOf(prefs.danceEvery)), function (i) { prefs.danceEvery = DN[i]; savePrefs(); });
    var armed = false;
    $('wipe').addEventListener('click', function () {
      if (!armed) { armed = true; $('wipe').textContent = 'Toca otra vez para borrar'; return; }
      records = { facil: 0, normal: 0, dificil: 0, learned: {} }; saveRecords();
      close(); drawMenu(); say('Récords borrados');
    });
    function close() { bg.remove(); $('gear').focus(); }
    $('done').addEventListener('click', close);
    bg.addEventListener('click', function (e) { if (e.target === bg) close(); });
    bg.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
    $('done').focus();
  }
  $('gear').addEventListener('click', openSettings);
  function switchChar(key) {
    if (app.classList.contains('playing')) endGame('Cuando quieras seguimos');
    prefs.char = key || who().other; savePrefs();
    drawChar(); drawMenu();
    setFace('happy', 'big', 'up'); anim('dance');
    say('¡Hola! Soy Slidy');
    setTimeout(function () { if (game.phase === 'menu') setFace('open', 'smile', 'neutral'); }, 1500);
  }
  $('brand').addEventListener('click', function () { unlock(); switchChar(); });

  // ---------- Bienvenida: escenario al abrir el juego; la primera vez eligen juntos el color ----------
  var WAVE_ICON = '<svg class="wave" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 11V6.5a1.5 1.5 0 0 1 3 0V11M10 10V4.5a1.5 1.5 0 0 1 3 0V10M13 10V5.5a1.5 1.5 0 0 1 3 0v6M16 11.5V9a1.5 1.5 0 0 1 3 0v5a7 7 0 0 1-7 7h-.6a6 6 0 0 1-4.8-2.4L3.6 14.6a1.5 1.5 0 0 1 2.3-1.9L7 14"/></svg>';
  function welcome(full) {
    if ($('welcome')) return;
    var first = full || !prefs.welcomed;
    var w = document.createElement('div');
    w.className = 'welcome'; w.id = 'welcome';
    w.setAttribute('role', 'dialog'); w.setAttribute('aria-modal', 'true'); w.setAttribute('aria-label', 'Bienvenida a Slidy y Bizy');
    var sparks = [['★', '#FFE45C', '8%', '30%', '28px', '0s'], ['♥', '#FF5C9A', '88%', '33%', '26px', '.8s'], ['★', '#FFFFFF', '82%', '8%', '20px', '1.4s'],
      ['♥', '#FF8DC0', '14%', '58%', '20px', '.4s'], ['★', '#FFE45C', '92%', '58%', '22px', '1.9s']].map(function (k) {
      return '<span class="spark" style="color:' + k[1] + '; left:' + k[2] + '; top:' + k[3] + '; font-size:' + k[4] + '; animation-delay:' + k[5] + '">' + k[0] + '</span>';
    }).join('');
    w.innerHTML = '<div class="scene" aria-hidden="true"><span class="cloud c1"></span><span class="cloud c2"></span><span class="cloud c3"></span>' +
      '<div class="hill h1"></div><div class="hill h2"></div><div class="ground"></div>' + sparks + '</div>' +
      '<div class="pair"></div>' +
      '<div class="bubble" id="wBubble" aria-live="polite"><small>Slidy y Bizy</small>' + (first ? '¡Hola! ¿Jugamos?' : '¡Hola de nuevo!') + '</div>' +
      '<div id="wStep"><button class="go" id="wStart">' + WAVE_ICON + (first ? 'Toca aquí' : '¡A jugar!') + '</button></div>' +
      '<p class="devbadge">En desarrollo · versión de prueba</p>';
    document.body.appendChild(w);
    var pair = w.querySelector('.pair');
    var fs = {};
    ['slidy', 'bizy'].forEach(function (c) {
      var who = document.createElement('div'); who.className = 'who';
      who.innerHTML = '<span class="logo ' + c + '" aria-hidden="true">' + CHARS[c].name + '</span>';
      var f = cloneFace(c);
      f.setAttribute('data-mouth', 'big');
      f.classList.add('waving');
      who.appendChild(f); pair.appendChild(who);
      fs[c] = f;
    });
    fs.slidy.style.setProperty('--px', '5px'); fs.bizy.style.setProperty('--px', '-5px');
    var bubble = $('wBubble');
    async function line(char, text) {
      bubble.innerHTML = '<small>' + CHARS[char].name + '</small>';
      bubble.appendChild(document.createTextNode(text));
      var f = fs[char];
      f.classList.remove('talk'); void f.getBoundingClientRect(); f.classList.add('talk');
      f.setAttribute('data-brows', 'up');
      await Promise.all([speak(text, { char: char, face: f }), sleep(1100)]);
      f.setAttribute('data-brows', 'neutral');
    }
    function leave(msg) {
      w.classList.add('bye');
      setTimeout(function () { w.remove(); }, 380);
      say(msg);
      greetPads();
    }
    $('wStart').addEventListener('click', async function () {
      unlock();
      bell(783.99, 0, 0.6); bell(1046.5, 0.12, 0.6);
      if (!first) { leave('¡Hola de nuevo! Soy Slidy'); return; }
      $('wStep').innerHTML = '';
      await line('slidy', '¡Hola! Soy Slidy.');
      await line('bizy', '¡Y yo soy Bizy!');
      await line('slidy', '¿Qué color te gusta más?');
      var step = $('wStep');
      step.innerHTML = '<div class="swatches"><button class="swatch rosa" data-p="rosa" aria-pressed="false">Rosa</button><button class="swatch azul" data-p="azul" aria-pressed="false">Azul</button></div>';
      [].slice.call(step.querySelectorAll('.swatch')).forEach(function (b) {
        b.addEventListener('click', async function () {
          var key = b.getAttribute('data-p');
          prefs.pal = key; savePrefs(); applyPal();
          [].slice.call(step.querySelectorAll('.swatch')).forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
          ['slidy', 'bizy'].forEach(function (c) { fs[c].setAttribute('data-eyes', 'happy'); });
          bell(key === 'rosa' ? 783.99 : 1046.5, 0, 0.7);
          if (!$('wDone')) {
            var d = document.createElement('button');
            d.className = 'go'; d.id = 'wDone'; d.textContent = '¡Listo!'; d.style.marginTop = '18px';
            d.addEventListener('click', function () { prefs.welcomed = true; savePrefs(); leave('¡A jugar!'); });
            step.appendChild(d);
          }
          await line(key === 'rosa' ? 'bizy' : 'slidy', key === 'rosa' ? '¡Rosa! Qué bonito.' : '¡Azul como el cielo!');
          ['slidy', 'bizy'].forEach(function (c) { fs[c].setAttribute('data-eyes', 'open'); });
        });
      });
    });
    $('wStart').focus();
  }

  // ---------- Arranque ----------
  drawMenu();
  setModeSeg(prefs.mode);
  checkRoutine();
  welcome();
  setTimeout(greetPads, 600);
  setTimeout(function () { if (game.phase === 'menu') { setFace('happy', 'smile', 'up'); anim('nod'); } }, 2000);
  setTimeout(function () { if (game.phase === 'menu') setFace('open', 'smile', 'neutral'); }, 2900);
})();
</script>

</body>
</html>
